spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

management.endpoints.web.exposure.include=health

server.port=${PORT:8080}
server.forward-headers-strategy=framework

app.canonical-host=${CANONICAL_HOST:}
app.cookie-secure=${COOKIE_SECURE:true}
app.public-url=${PUBLIC_URL}
app.mail.from-address=${MAIL_FROM_ADDRESS}
app.mail.resend-api-key=${RESEND_API_KEY}

# Falar com o suporte (spec 010): sem o endereço o app não sobe
app.support.email=${SUPPORT_EMAIL}

# Painel de chamados (spec 017): e-mails dos administradores, separados por vírgula. Opcional: vazio, ninguém é administrador
app.admin.emails=${ADMIN_EMAILS:}

# Apoio ao projeto (spec 019): chave Pix aleatoria e caminho, dentro do container, da imagem do QR code. Opcional: sem chave, o apoio nao aparece
app.pix.key=${PIX_KEY:}
app.pix.qr-file=${PIX_QR_FILE:}
