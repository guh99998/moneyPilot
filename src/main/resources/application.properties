spring.application.name=moneyPilot
spring.profiles.active=local
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

app.rate-limit.login-per-ip=10
app.rate-limit.login-failures-per-email=3
app.rate-limit.login-window=15m
app.rate-limit.register-per-ip=3
app.rate-limit.register-window=1h
app.rate-limit.password-change-failures=5
app.rate-limit.password-change-window=15m
app.rate-limit.email-change-requests=3
app.rate-limit.email-change-window=1h

# E-mail transacional (spec 001). Em prod a chave e o remetente vêm do ambiente (application-prod.properties)
app.public-url=http://localhost:8080
app.mail.from-name=Money Pilot
app.mail.base-url=https://api.resend.com
